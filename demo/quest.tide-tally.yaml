  - kind: quest-count-kill
    loc_ref: TideTally.Counter.txt
    limit: 1
    internal: false
    show_count: true
    targets:
      - id: mob.paper-harbor.tide-crab
        href: /Demo/Creatures/TideCrab.xdb#mob
rewards:
  experience: 8
  money: 2
  # Two distinct items of stack_limit 1, which is what mechanics/quests.md rule
  # 6.2's net-slot arithmetic needs to have a non-zero answer.
  mandatory_items:
    - item:
        id: item.junk.brine-scale
        href: /Demo/Items/Junk/BrineScale.xdb#item
      count: 1
      hidden: false
    - item:
        id: item.quest-rewards.tide-token
        href: /Demo/Items/QuestRewards/TideToken.xdb#item
      count: 1
      hidden: false
flags:
