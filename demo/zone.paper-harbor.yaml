  description: PaperHarbor.Description.txt
maps:
  - paper-harbor
  - tide-steps
# Deliberately not the League warrior chargen option's spawn. ADR 0032 makes a
# created character's start point a property of the option; this is the zone's
# own fallback, for a debug entity or one whose owner has no saved position.
# The fixture keeps the two apart so a reader that confused them fails here
# rather than in a shard.
player_spawn:
  map: paper-harbor
  position:
    x: -6.0
    y: 10.0
    z: 0.0
  heading: 180.0
bounds:
  min:
    x: -64.0
    y: -64.0
    z: -8.0
  max:
    x: 64.0
    y: 64.0
    z: 32.0
level_range:
  min: 1
  max: 5
instance:
  instanced: true
  max_players: 5
  reset_policy: on-empty
  empty_shutdown_s: 300
_source:
  path: Demo/Maps/PaperHarbor/PaperHarbor.xdb
  blake3: "3333333333333333333333333333333333333333333333333333333333333333"
  extractor: sarnaut-extract@0.1.0-demo
  source_root: demo-server
